name: Verify Twynix HMI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .tooling-python-version
      - run: python scripts/validate_setup.py --strict
      - run: python scripts/check.py
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Preserve all results, including baseline failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-evidence
          path: |
            artifacts/verification/
            playwright-report/
            test-results/
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: twynix_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: twynix_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twynix_test -d twynix_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TWYNIX_TEST_DATABASE_URL: postgres://twynix_test:disposable_ci_password@127.0.0.1:5432/twynix_test_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run benchmark
      - run: npm run test:performance
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-evidence
          path: artifacts/benchmarks/

  required:
    name: Required checks
    if: always()
    needs: [foundation, quality, postgres, benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      FOUNDATION_RESULT: ${{ needs.foundation.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      POSTGRES_RESULT: ${{ needs.postgres.result }}
      BENCHMARK_RESULT: ${{ needs.benchmark.result }}
    steps:
      - name: Require all configured project gates
        shell: bash
        run: |
          test "$FOUNDATION_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$BENCHMARK_RESULT" = success
